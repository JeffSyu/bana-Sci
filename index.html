  <style>
    /* 定義全域色彩變數，方便未來統一修改 */
    :root {
      --primary-color: #F59E0B; /* 呼應香蕉的暖黃/橘色 */
      --bg-color: #F3F4F6;      /* 柔和的淺灰背景 */
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
    }

    body {
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 加入容器限制最大寬度，避免在大螢幕上比例失衡 */
    .container {
      max-width: 640px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    h1 span {
      color: var(--primary-color);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin: 0;
    }

    /* 現代卡片設計 */
    .drop-box {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .drop-box:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .drop-header {
      padding: 20px 24px;
      background-color: transparent;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      outline: none;
      transition: background-color 0.3s;
    }

    .drop-header.active, .drop-header:hover {
      background-color: #FAFAFA;
    }

    .drop-header .drop-arrow {
      transform-origin: 50% 50%;
      transition: transform 0.3s ease;
      fill: var(--text-muted);
    }

    .drop-header.active .drop-arrow {
      transform: rotate(180deg);
      fill: var(--primary-color);
    }

    .drop-content {
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }

    /* 選單內的連結項目 */
    .tool {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      color: var(--text-main);
      text-decoration: none;
      border-top: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .tool:hover {
      background-color: #FFFBEB; /* 淺黃色懸浮背景 */
      padding-left: 32px; /* 懸浮時產生往右的動態引導感 */
      color: var(--primary-color);
      font-weight: 600;
    }

    /* 確保 SVG 縮放正確且與文字對齊 */
    .icon {
      width: 24px;
      height: 24px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .icon path {
      transition: fill 0.2s ease;
    }

    .tool:hover .icon path {
      fill: var(--primary-color);
    }

    /* 若沒有 icon 的項目，用點綴圖案代替對齊 */
    .tool span {
      display: flex;
      align-items: center;
    }
  </style>
</head>

    var acc = document.getElementsByClassName("drop-header"); 
    for (var i = 0; i < acc.length; i++) {
      acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var panel = this.nextElementSibling;
        if (panel.style.maxHeight) {
            panel.style.maxHeight = null;
        } else {
            panel.style.maxHeight = panel.scrollHeight + "px";
        }
      });
